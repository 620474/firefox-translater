name: Platform checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build:api
      - run: npm run package:all -- 0.0.0-preview
      - name: Upload unsigned test packages
        uses: actions/upload-artifact@v4
        with:
          name: platform-preview
          path: |
            dist/*.user.js
            dist/*.koplugin.zip
            dist/firefox-translator-v*.zip
